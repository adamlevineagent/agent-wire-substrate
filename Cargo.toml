[workspace]
members = [
    "crates/contracts",
    "crates/foundation",
    "crates/transport-cloudflare",
    "crates/compute-market",
    "crates/storage-market",
    "crates/relay-market",
    "crates/substrate",
    "crates/node",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/agent-wire-com/agent-wire-substrate"
rust-version = "1.78"

[workspace.dependencies]
agent-wire-compute-market = { version = "0.1.0", path = "crates/compute-market" }
agent-wire-contracts = { version = "0.1.0", path = "crates/contracts" }
agent-wire-foundation = { version = "0.1.0", path = "crates/foundation" }
agent-wire-relay-market = { version = "0.1.0", path = "crates/relay-market" }
agent-wire-storage-market = { version = "0.1.0", path = "crates/storage-market" }
agent-wire-substrate = { version = "0.1.0", path = "crates/substrate" }
agent-wire-transport-cloudflare = { version = "0.1.0", path = "crates/transport-cloudflare" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.8", features = ["serde", "v4"] }
