[workspace]
members = [
    "crates/contracts",
    "crates/foundation",
    "crates/transport-cloudflare",
    "crates/compute-market",
    "crates/storage-market",
    "crates/relay-market",
    "crates/node",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/adamlevineagent/agent-wire-substrate"
rust-version = "1.78"

[workspace.dependencies]
agent-wire-contracts = { path = "crates/contracts" }
agent-wire-foundation = { path = "crates/foundation" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
